bind = , code:191, exec, /home/juizy/scripts/lightsoff.sh
bind = , code:192, exec, /home/juizy/scripts/lightson.sh

unbind = Control Alt, Delete, $d logout menu, exec, $scrPath/logoutlaunch.sh
bindd = $mainMod, Backspace, $d logout menu, exec, $scrPath/logoutlaunch.sh

unbind = $mainMod, B, $d web browser , exec, $BROWSER
bindd = $mainMod, F, $d web browser , exec, $BROWSER

unbind = $mainMod, slash, $d keybindings hint, exec, pkill -x rofi || $scrPath/keybinds_hint.sh c # launch keybinds hint
bindd = $mainMod, B, $d keybindings hint, exec, pkill -x rofi || $scrPath/keybinds_hint.sh c # launch keybinds hint
